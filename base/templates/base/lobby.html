{% extends 'base/main.html' %}
{% load static %}

{% block title %}COMMAND CENTER{% endblock %}

{% block content %}
<div class="lobby-container">
    <div class="tactical-panel">
        <div class="panel-header">
            <h1 class="panel-title">Command Center</h1>
            <span class="panel-id">CMD-001</span>
        </div>

        <p class="panel-subtitle">// Initialize tactical video communication channel</p>

        <!-- Operator Info -->
        <div class="operator-info">
            <div class="operator-avatar">
                {{ user.username|slice:":2"|upper }}
            </div>
            <div class="operator-details">
                <div class="operator-label">Operator</div>
                <div class="operator-name">{{ user.username|upper }}</div>
            </div>
            <div class="operator-status">READY</div>
        </div>

        <form id="form">
            <div class="form-group">
                <label class="form-label" for="room">Channel Designation</label>
                <input
                    type="text"
                    id="room"
                    name="room"
                    class="form-input"
                    placeholder="Enter channel code..."
                    required
                    pattern="[a-zA-Z0-9_-]+"
                    maxlength="64"
                    style="text-transform: uppercase;"
                >
            </div>

            <button type="submit" class="btn btn-block">
                <span>[>]</span> Connect to Channel
            </button>
        </form>
    </div>
</div>

<script>
    // Clear any stale session data when entering lobby
    sessionStorage.removeItem('UID')
    sessionStorage.removeItem('token')
    sessionStorage.removeItem('room')
    sessionStorage.removeItem('name')
    sessionStorage.removeItem('appId')

    const form = document.getElementById('form')
    const username = '{{ user.username }}'

    const handleSubmit = async (e) => {
        e.preventDefault()

        let room = e.target.room.value.trim().toUpperCase()

        // Validate room name
        if (!room || room.length < 1 || room.length > 64) {
            alert('INVALID INPUT: Channel designation must be 1-64 characters')
            return
        }

        if (!/^[a-zA-Z0-9_-]+$/.test(room)) {
            alert('INVALID INPUT: Channel designation can only contain alphanumeric characters, underscores, and hyphens')
            return
        }

        try {
            // Get token from backend
            const response = await fetch(`/get_token/?channel=${encodeURIComponent(room)}`)

            if (!response.ok) {
                const error = await response.json()
                throw new Error(error.error || 'Failed to get authentication token')
            }

            const data = await response.json()

            // Validate response
            if (!data.uid || !data.token || !data.app_id) {
                throw new Error('Invalid server response')
            }

            // Store in sessionStorage
            sessionStorage.setItem('UID', data.uid)
            sessionStorage.setItem('token', data.token)
            sessionStorage.setItem('room', room)
            sessionStorage.setItem('name', username)
            sessionStorage.setItem('appId', data.app_id)

            // Redirect to room
            window.location.href = '/room/'
        } catch (error) {
            console.error('Connection error:', error)
            alert('CONNECTION FAILED: ' + error.message)
        }
    }

    form.addEventListener('submit', handleSubmit)
</script>
{% endblock %}

{% extends 'base/main.html' %}
{% load static %}
{% block content %}

<main>

    <section id="form-container">

        <img id="logo" src="{% static 'images/chat-icon.png' %}"/>

        <div id="welcome-message">
            <h1>Welcome to MyChat</h1>
            <p>A group video calling platform made just for you!</p>
        </div>

        <form id="form">
            <div class="field-wrapper">

                <div class="form-field">
                    <label>Room:</label>
                    <input name="room" placeholder="Enter a room name..."  style="text-transform:uppercase"/>
                </div>

                <div class="form-field">
                    <label>Name:</label>
                    <input name="name" placeholder="Enter your name..."  style="text-transform:uppercase"/>
                </div>

                <div class="form-field">
                    <input type="submit" value="Join Stream" />
                </div>
            </div>
        </form>
    </section>
</main>

<script>
    let form = document.getElementById('form')

    let handleSubmit = async (e) => {
        e.preventDefault()

        let room = e.target.room.value.trim().toUpperCase()
        let name = e.target.name.value.trim()

        // Validate inputs client-side
        if (!room || room.length < 1 || room.length > 64) {
            alert('Please enter a valid room name (1-64 characters)')
            return
        }

        if (!name || name.length < 2 || name.length > 100) {
            alert('Please enter a valid name (2-100 characters)')
            return
        }

        // Validate allowed characters
        if (!/^[a-zA-Z0-9_-]+$/.test(room)) {
            alert('Room name can only contain letters, numbers, underscores, and hyphens')
            return
        }

        if (!/^[a-zA-Z0-9_\s-]+$/.test(name)) {
            alert('Name contains invalid characters')
            return
        }

        try {
            // Get token from backend
            let response = await fetch(`/get_token/?channel=${encodeURIComponent(room)}`)

            if (!response.ok) {
                let error = await response.json()
                throw new Error(error.error || 'Failed to get token')
            }

            let data = await response.json()

            // Validate response
            if (!data.uid || !data.token || !data.app_id) {
                throw new Error('Invalid server response')
            }

            let UID = data.uid
            let token = data.token
            let appId = data.app_id

            // Store in sessionStorage
            sessionStorage.setItem('UID', UID)
            sessionStorage.setItem('token', token)
            sessionStorage.setItem('room', room)
            sessionStorage.setItem('name', name)
            sessionStorage.setItem('appId', appId)

            // Redirect to room
            window.open('/room/', '_self')
        } catch (error) {
            console.error('Error joining room:', error)
            alert('Failed to join room: ' + error.message)
        }
    }

    form.addEventListener('submit', handleSubmit)
</script>

{% endblock content %}
